<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="beamGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Container Icon Card with Soft Rounded Corners -->
  <rect width="64" height="64" rx="16" fill="url(#beamGrad)" />

  <!-- Load Arrow (Cyan/Sky Blue) -->
  <g stroke="#38bdf8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <path d="M 32 10 V 25" stroke-width="4" />
    <path d="M 25 20 L 32 27 L 39 20" stroke-width="3.5" fill="none" />
  </g>

  <!-- Structural Beam (Crisp White Bar) -->
  <rect x="9" y="31" width="46" height="6" rx="3" fill="#ffffff" filter="url(#glow)" />

  <!-- Supports (Pin Support on Left, Roller Support on Right) -->
  <g fill="#ffffff" opacity="0.95" filter="url(#glow)">
    <!-- Left Pin Support -->
    <path d="M 17 38 L 11 47 H 23 Z" />
    <rect x="9" y="48" width="16" height="2" rx="1" opacity="0.8" />

    <!-- Right Roller Support -->
    <path d="M 47 38 L 41 47 H 53 Z" />
    <circle cx="44" cy="50.5" r="1.5" />
    <circle cx="50" cy="50.5" r="1.5" />
    <rect x="41" y="53" width="14" height="1.5" rx="0.75" opacity="0.7" />
  </g>
</svg>
